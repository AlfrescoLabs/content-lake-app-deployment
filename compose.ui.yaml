# compose.ui.yaml — UI services and reverse proxy
# Part of the content-lake-app stack; loaded via include: in compose.yaml.
# Profiles: alfresco, full, demo (content-app + proxy); demo only (content-lake-app-ui)

services:

  content-app:
    profiles: [alfresco, full, demo]
    build:
      context: "${CONTENT_LAKE_UI_GIT_CONTEXT:-https://github.com/AlfrescoLabs/alfresco-content-lake-ui.git#main}"
      dockerfile: docker/Dockerfile
      args:
        ACA_TAG: ${ACA_TAG:-7.3.0}
        ACA_BUILDER_IMAGE:
        ACA_RUNTIME_IMAGE:
    environment:
      APP_CONFIG_ECM_HOST: ${PUBLIC_BASE_URL:-http://localhost:${PUBLIC_PORT:-80}}
      APP_CONFIG_RAG_URL: ${PUBLIC_BASE_URL:-http://localhost:${PUBLIC_PORT:-80}}/api/rag
    depends_on:
      alfresco:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    networks:
      - stack

  # Demo UI — standalone SPA for showcasing RAG without ACA (demo profile only)
  content-lake-app-ui:
    profiles: [demo, platform]
    build:
      context: "${CONTENT_LAKE_APP_UI_CONTEXT:-https://github.com/AlfrescoLabs/content-lake-app-ui.git#main}"
    ports:
      - target: 80
        published: "${DEMO_UI_PORT:-4200}"
        host_ip: "${BIND_IP:-0.0.0.0}"
        protocol: tcp
    environment:
      ALFRESCO_URL: ${PUBLIC_BASE_URL:-}
      NUXEO_URL: ${PUBLIC_BASE_URL:-}/nuxeo
      RAG_URL: ${PUBLIC_BASE_URL:-}/api/rag
      # The plugin host, which serves the connector listing, the folder browse, the selection and sync. Empty
      # by default, which turns the Sources screen and its nav entry off.
      #
      # Off is the right default because the connector profile is opt-in: a demo stack without it has no host
      # to talk to, and a screen that answers 502 is worse than one that is absent. A deployment running the
      # connector profile sets this, and the Makefile header documents it alongside that profile's other
      # variables.
      #
      # Deliberately `:-` with an empty default rather than `:-/api/connectors`. Giving it a real default made
      # this impossible to switch off: `:-` substitutes when the variable is empty *or* unset, so
      # CONNECTORS_URL= left the screen on, and every demo stack got it whether or not a connector was running.
      #
      # Same-origin through the proxy when it is set, not the host's published port, so the browser sends this
      # origin's credential and needs no cross-origin configuration.
      CONNECTORS_URL: ${CONNECTORS_URL:-}
      # Microsoft sign-in for the SharePoint source: the content-lake-ui registration's client id and tenant.
      # Both empty, the default, turns it off. rag-service needs RAG_SECURITY_ENTRA_CALLER_AUTH_ENABLED=true
      # with the same client id to accept the tokens.
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rag-service:
        condition: service_started
    networks:
      - stack

  # ── Reverse proxy ───────────────────────────────────────────────────────────

  proxy:
    profiles: [alfresco, nuxeo, full, demo, platform]
    image: nginx:stable-alpine
    ports:
      - target: 80
        published: "${PUBLIC_PORT:-80}"
        host_ip: "${BIND_IP:-0.0.0.0}"
        protocol: tcp
      - target: 443
        published: "${HTTPS_PORT:-443}"
        host_ip: "${BIND_IP:-0.0.0.0}"
        protocol: tcp
    environment:
      NGINX_SYNC_DEFAULT_BACKEND: ${NGINX_SYNC_DEFAULT_BACKEND:-batch-ingester:9090}
      NGINX_ROOT_DIRECTIVE: ${NGINX_ROOT_DIRECTIVE:-return 302 /aca/;}
      # Which $arg_sourceType routes /api/sync to the plugin host. It is whatever the mounted connector jar
      # declares, so the deployment has to say; the sentinel default is a value no real source type can equal,
      # which keeps the map valid on a stack with no connector profile rather than emitting an empty map key.
      NGINX_CONNECTOR_SOURCE_TYPE: ${CONNECTOR_SOURCE_TYPE:-__no_connector__}
      SERVER_NAME: ${SERVER_NAME:-localhost}
      USE_HTTPS: ${USE_HTTPS:-false}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/conf-template/nginx.conf.template:ro
      - ./nginx/certs/local:/etc/nginx/certs:ro
    command:
      - /bin/sh
      - -c
      - |
          set -e
          envsubst '$$NGINX_SYNC_DEFAULT_BACKEND $$NGINX_ROOT_DIRECTIVE $$NGINX_CONNECTOR_SOURCE_TYPE $$SERVER_NAME' \
            < /etc/nginx/conf-template/nginx.conf.template \
            > /tmp/nginx.conf.substituted
          if [ "$$USE_HTTPS" = "true" ] && [ -f /etc/nginx/certs/server.crt ]; then
            sed -i 's|##HTTPS_REDIRECT_PLACEHOLDER##|return 301 https://$$host$$request_uri;|' /tmp/nginx.conf.substituted
            sed -i '/##HTTPS_SERVER_BLOCK_START##/d; /##HTTPS_SERVER_BLOCK_END##/d' /tmp/nginx.conf.substituted
          else
            sed -i 's|##HTTPS_REDIRECT_PLACEHOLDER##||' /tmp/nginx.conf.substituted
            sed -i '/##HTTPS_SERVER_BLOCK_START##/,/##HTTPS_SERVER_BLOCK_END##/d' /tmp/nginx.conf.substituted
          fi
          nginx -c /tmp/nginx.conf.substituted -g 'daemon off;'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rag-service:
        condition: service_started
    networks:
      - stack
