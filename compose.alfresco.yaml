# compose.alfresco.yaml — Alfresco content services
# Part of the content-lake-app stack; loaded via include: in compose.yaml.
# Profiles: alfresco, full, demo

services:

  postgres:
    profiles: [alfresco, full, demo]
    image: postgres:${POSTGRES_TAG:-15.6}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: postgres -c max_connections=200 -c log_min_messages=LOG
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stack

  activemq:
    profiles: [alfresco, full, demo]
    image: alfresco/alfresco-activemq:${ACTIVEMQ_TAG:-5.18-jre17-rockylinux8}
    restart: unless-stopped
    environment:
      ACTIVEMQ_ADMIN_LOGIN: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_ADMIN_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - --user
        - ${ACTIVEMQ_USER:-admin}:${ACTIVEMQ_PASSWORD:-admin}
        - http://localhost:8161/admin/
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stack

  alfresco:
    profiles: [alfresco, full, demo]
    restart: unless-stopped
    build:
      context: ./acs/alfresco
      additional_contexts:
        content_lake_app: ${CONTENT_LAKE_ACS_GIT_CONTEXT:-https://github.com/AlfrescoLabs/content-lake-app.git#main}
      args:
        ALFRESCO_TAG: ${ALFRESCO_CE_TAG:-26.2.0}
        ACS_MODEL_BUILD_IMAGE:
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Ddb.username=${POSTGRES_USER}
        -Ddb.password=${POSTGRES_PASSWORD}
        -Ddb.driver=org.postgresql.Driver
        -Ddb.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
        -Dalfresco_user_store.adminpassword=209c6174da490caeb422f3fa5a7ae634
        -Dsystem.preferred.password.encoding=bcrypt10
        -Dindex.subsystem.name=elasticsearch
        -Delasticsearch.host=opensearch
        -Delasticsearch.port=9200
        -Delasticsearch.createIndexIfNotExists=true
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=${SHARED_SECRET}
        -Dalfresco.host=${SERVER_NAME:-localhost}
        -Dalfresco.port=${PUBLIC_PORT:-80}
        -Dapi-explorer.url=http://${SERVER_NAME:-localhost}:${PUBLIC_PORT:-80}/api-explorer
        -Dalfresco.protocol=http
        -Dshare.host=${SERVER_NAME:-localhost}
        -Dshare.port=${PUBLIC_PORT:-80}
        -Dshare.protocol=http
        -Daos.baseUrlOverwrite=http://${SERVER_NAME:-localhost}:${PUBLIC_PORT:-80}/alfresco/aos
        -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
        -Dmessaging.broker.username=${ACTIVEMQ_USER:-admin}
        -Dmessaging.broker.password=${ACTIVEMQ_PASSWORD:-admin}
        -Ddeployment.method=DOCKER_COMPOSE
        -Dcsrf.filter.enabled=false
        -Dopencmis.server.override=true
        -Dopencmis.server.value=http://${SERVER_NAME:-localhost}:${PUBLIC_PORT:-80}
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -Dhttpclient.config.transform.connectionRequestTimeout=500000
        -Dalfresco.restApi.basicAuthScheme=true
        -Dauthentication.protection.enabled=false
        -Dcontent.lake.permission.sync.enabled=${CONTENT_LAKE_PERMISSION_SYNC_ENABLED:-true}
        -Dcontent.lake.permission.sync.broker-url=${CONTENT_LAKE_PERMISSION_SYNC_BROKER_URL:-tcp://activemq:61616}
        -Dcontent.lake.permission.sync.broker-user=${ACTIVEMQ_USER:-admin}
        -Dcontent.lake.permission.sync.broker-password=${ACTIVEMQ_PASSWORD:-admin}
        -Dcontent.lake.permission.sync.queue-name=${CONTENT_LAKE_PERMISSION_SYNC_QUEUE_NAME:-contentlake.acl.changed}
        -XX:+UseG1GC -XX:+UseStringDeduplication
        -Dgoogledocs.enabled=false
        -Ddev.email.not.sent=true
        -XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80
    volumes:
      - alf-repo-data:/usr/local/tomcat/alf_data
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 1m
    networks:
      - stack

  # Alfresco Search Community batch indexer (ACS 26.2+). Feeds the repository "alfresco"
  # index into the shared OpenSearch cluster (compose.hxpr.yaml). Continuous-polling mode:
  # on a clean deploy it starts at "now" and indexes content created while it runs.
  batch-indexer:
    profiles: [alfresco, full, demo]
    image: alfresco/alfresco-elasticsearch-batch-indexing:${SEARCH_INDEXER_TAG:-5.7.0}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_ELASTICSEARCH_REST_URIS: http://opensearch:9200
      ALFRESCO_ACS_URL: http://alfresco:8080
      ALFRESCO_ACCEPTEDCONTENTMEDIATYPESCACHE_BASEURL: http://transform-core-aio:8090/transform/config
      ALFRESCO_CONTENT_TRANSFORM_SHAREDSECRET: ${SHARED_SECRET}
      # Dev/demo tuning: poll Alfresco every ${SEARCH_INDEXER_POLLINGINTERVAL:-2s} (vs the 15s
      # production default) so freshly created/updated content becomes AFTS-searchable within a
      # couple of seconds -- close to the near-real-time behaviour the Solr backend had.
      ALFRESCO_REINDEX_CONTINUOUS_POLLINGINTERVAL: ${SEARCH_INDEXER_POLLINGINTERVAL:-2s}
      ALFRESCO_REINDEX_CONTINUOUS_CATCHUPPOLLINGINTERVAL: 1s
      ALFRESCO_REINDEX_CONTINUOUS_MAXWINDOW: 30m
      ALFRESCO_REINDEX_CONTINUOUS_OVERLAP: 10m
      # The indexer reads the repository straight from the database, so it resolves namespace
      # URI -> prefix from a static file instead of the repository dictionary. The bundled
      # classpath:reindex.prefixes-file.json only lists stock Alfresco namespaces, so every
      # cl:* aspect and property is dropped ("impossible to get prefixed name of ...") and no
      # cl:* field ever reaches the index. acs/search/reindex.prefixes-file.json is that file
      # plus the content-lake namespace.
      ALFRESCO_REINDEX_PREFIXES_FILE: file:/opt/search/reindex.prefixes-file.json
    volumes:
      - ./acs/search/reindex.prefixes-file.json:/opt/search/reindex.prefixes-file.json:ro
    depends_on:
      alfresco:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - stack

  transform-core-aio:
    profiles: [alfresco, full, demo]
    image: alfresco/alfresco-transform-core-aio:${TRANSFORM_ENGINE_TAG:-5.2.4}
    restart: unless-stopped
    environment:
      ACTIVEMQ_URL: nio://activemq:61616
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80
        -Dlogging.level.org.alfresco.transform=ERROR
        -Dlogging.level.org.alfresco.transform.router=ERROR
    depends_on:
      activemq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - stack

  # Alfresco Admin Control Center
  control-center:
    profiles: [alfresco, full, demo]
    image: quay.io/alfresco/alfresco-control-center:${CONTROL_CENTER_TAG:-10.2.0}
    environment:
      APP_CONFIG_ECM_HOST: ${PUBLIC_BASE_URL:-http://${SERVER_NAME:-localhost}:${PUBLIC_PORT:-80}}
      APP_CONFIG_AUTH_TYPE: BASIC
      APP_CONFIG_PROVIDER: ECM
      BASE_PATH: /admin
    networks:
      - stack
