# compose.content-lake.yaml — Content Lake ingestion and RAG services
# Part of the content-lake-app stack; loaded via include: in compose.yaml.
# Profiles: alfresco, full, demo (Alfresco ingesters + live ingester); nuxeo, full, demo (Nuxeo ingesters + live ingester);
#           all profiles (rag-service)
#
# Build approach: each service uses a local Dockerfile in dockerfiles/<service>/ that pulls
# app source via additional_context "code" (CONTENT_LAKE_GIT_CONTEXT -- remote Git URL or
# local ../content-lake-app path). This eliminates duplicate dockerfile_inline blocks while
# keeping the remote-source build capability.

services:

  # ── Alfresco ingesters ──────────────────────────────────────────────────────

  batch-ingester:
    profiles: [alfresco, full, demo]
    image: content-lake-app/batch-ingester:local
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
      target: batch-ingester
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/AlfrescoLabs/content-lake-app.git#main}"
      # Bare names: forwarded only when set, otherwise the Dockerfile's public default image applies.
      args:
        - CONTENT_LAKE_BUILD_IMAGE
        - CONTENT_LAKE_RUNTIME_IMAGE
    environment:
      ACTIVEMQ_URL: ${CONTENT_LAKE_PERMISSION_SYNC_BROKER_URL:-tcp://activemq:61616}
      ACTIVEMQ_USER: ${ACTIVEMQ_USER}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
      ALFRESCO_URL: http://alfresco:8080
      ALFRESCO_INTERNAL_USERNAME: ${ALFRESCO_ADMIN_USER}
      ALFRESCO_INTERNAL_PASSWORD: ${ALFRESCO_ADMIN_PASSWORD}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      HXPR_TARGET_PATH: ${HXPR_TARGET_PATH}
      HXPR_USERNAME: ${HXPR_USERNAME}
      HXPR_PASSWORD: ${HXPR_PASSWORD}
      CONTENT_LAKE_PERMISSION_SYNC_QUEUE_NAME: ${CONTENT_LAKE_PERMISSION_SYNC_QUEUE_NAME:-contentlake.acl.changed}
      # Overridable so the ingester can be pointed at a markdown-capable engine (see the
      # transform-extras profile below) instead of the official plaintext-only AIO.
      TRANSFORM_URL: ${TRANSFORM_URL:-http://transform-core-aio:8090}
      TRANSFORM_TIMEOUT_MS: ${TRANSFORM_TIMEOUT_MS:-300000}
      # plaintext (default) keeps today's behaviour exactly. auto/markdown ask the engine for
      # text/markdown where it advertises it, so tables survive chunking as ChunkType.TABLE.
      EXTRACTION_FORMAT: ${EXTRACTION_FORMAT:-plaintext}
      # Extra extraction services tried before transform-core-aio, most structural first. Comma
      # separated; an entry may carry a backend-kind prefix (transform:, and others as they are added).
      # Empty means only the transform service above is used.
      EXTRACTION_ENGINE_URLS: ${EXTRACTION_ENGINE_URLS:-}
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
      LLM_MODEL: ${LLM_MODEL:-ai/gpt-oss}
      # Local model generation runs well beyond the OpenAI client's 10s default; extend it so the
      # per-document extraction call does not abort with OpenAIIoException.
      SPRING_HTTP_CLIENT_READ_TIMEOUT: ${SPRING_HTTP_CLIENT_READ_TIMEOUT:-180s}
      SPRING_HTTP_CLIENT_CONNECT_TIMEOUT: ${SPRING_HTTP_CLIENT_CONNECT_TIMEOUT:-10s}
      INGESTION_FOLDER_1: ${INGESTION_FOLDER_1:--root-}
      # Post-discovery reconciliation sweep. The application default is false; this stack opts in
      # because the end-to-end suite asserts the delete-while-live-ingester-down case. The ratio is
      # raised from 0.10 because the test corpus is a handful of documents, where 0.10 rounds to a
      # guard that trips on a single legitimate deletion.
      INGESTION_RECONCILE_ENABLED: ${INGESTION_RECONCILE_ENABLED:-true}
      INGESTION_RECONCILE_MAX_DELETE_RATIO: ${INGESTION_RECONCILE_MAX_DELETE_RATIO:-0.5}
      INGESTION_RECONCILE_MAX_DELETES: ${INGESTION_RECONCILE_MAX_DELETES:-1000}
      INGESTION_RECONCILE_MAX_SEEN_IDS: ${INGESTION_RECONCILE_MAX_SEEN_IDS:-200000}
      INGESTION_RECONCILE_PAGE_SIZE: ${INGESTION_RECONCILE_PAGE_SIZE:-200}
      # This service ingests through the client it was compiled against, never from a mounted jar,
      # so a connector whose settings are supplied to plugin-batch-ingester alone is listed with
      # its problem on GET /api/connectors rather than being fatal here. Set fail to refuse to start.
      CONNECTOR_VALIDATION: ${CONNECTOR_VALIDATION_INGESTERS:-warn}
    volumes:
      # Connector plugins (#124): any jar dropped in here is discovered at startup. Empty by default, so
      # this changes nothing until a connector is placed in it. Read-only: an ingester has no business
      # writing to its own plugin directory.
      - "${CONNECTOR_PLUGIN_PATH:-./connectors}:/opt/content-lake/connectors:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      alfresco:
        condition: service_healthy
      hxpr-app:
        condition: service_healthy
    networks:
      - stack

  # Alfresco live ingester (real-time event-driven sync via ActiveMQ)
  live-ingester:
    profiles: [alfresco, full, demo]
    image: content-lake-app/live-ingester:local
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
      target: live-ingester
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/AlfrescoLabs/content-lake-app.git#main}"
      args:
        - CONTENT_LAKE_BUILD_IMAGE
        - CONTENT_LAKE_RUNTIME_IMAGE
    environment:
      ACTIVEMQ_URL: tcp://activemq:61616
      ACTIVEMQ_USER: ${ACTIVEMQ_USER}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
      ALFRESCO_EVENT_TOPIC: alfresco.repo.event2
      ALFRESCO_URL: http://alfresco:8080
      ALFRESCO_INTERNAL_USERNAME: ${ALFRESCO_ADMIN_USER}
      ALFRESCO_INTERNAL_PASSWORD: ${ALFRESCO_ADMIN_PASSWORD}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      HXPR_TARGET_PATH: ${HXPR_TARGET_PATH}
      HXPR_USERNAME: ${HXPR_USERNAME}
      HXPR_PASSWORD: ${HXPR_PASSWORD}
      # Overridable so the ingester can be pointed at a markdown-capable engine (see the
      # transform-extras profile below) instead of the official plaintext-only AIO.
      TRANSFORM_URL: ${TRANSFORM_URL:-http://transform-core-aio:8090}
      TRANSFORM_TIMEOUT_MS: ${TRANSFORM_TIMEOUT_MS:-300000}
      # plaintext (default) keeps today's behaviour exactly. auto/markdown ask the engine for
      # text/markdown where it advertises it, so tables survive chunking as ChunkType.TABLE.
      EXTRACTION_FORMAT: ${EXTRACTION_FORMAT:-plaintext}
      # Extra extraction services tried before transform-core-aio, most structural first. Comma
      # separated; an entry may carry a backend-kind prefix (transform:, and others as they are added).
      # Empty means only the transform service above is used.
      EXTRACTION_ENGINE_URLS: ${EXTRACTION_ENGINE_URLS:-}
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
      LLM_MODEL: ${LLM_MODEL:-ai/gpt-oss}
      SPRING_HTTP_CLIENT_READ_TIMEOUT: ${SPRING_HTTP_CLIENT_READ_TIMEOUT:-180s}
      SPRING_HTTP_CLIENT_CONNECT_TIMEOUT: ${SPRING_HTTP_CLIENT_CONNECT_TIMEOUT:-10s}
      # This service ingests through the client it was compiled against, never from a mounted jar,
      # so a connector whose settings are supplied to plugin-batch-ingester alone is listed with
      # its problem on GET /api/connectors rather than being fatal here. Set fail to refuse to start.
      CONNECTOR_VALIDATION: ${CONNECTOR_VALIDATION_INGESTERS:-warn}
    volumes:
      # Connector plugins (#124): any jar dropped in here is discovered at startup. Empty by default, so
      # this changes nothing until a connector is placed in it. Read-only: an ingester has no business
      # writing to its own plugin directory.
      - "${CONNECTOR_PLUGIN_PATH:-./connectors}:/opt/content-lake/connectors:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      alfresco:
        condition: service_healthy
      hxpr-app:
        condition: service_healthy
    networks:
      - stack

  # ── RAG service ─────────────────────────────────────────────────────────────

  rag-service:
    profiles: [alfresco, nuxeo, full, demo, platform]
    image: content-lake-app/rag-service:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
      target: rag-service
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/AlfrescoLabs/content-lake-app.git#main}"
      args:
        - CONTENT_LAKE_BUILD_IMAGE
        - CONTENT_LAKE_RUNTIME_IMAGE
    environment:
      # Overridable, with the stack's own values as the defaults, so nothing changes for a normal run. Set
      # either to the empty string and that source's caller authentication declines without a call, which is
      # how test-cmis.sh isolates CMIS as the only authentication path. Nothing else here needs that.
      #
      # ${VAR-default}, not ${VAR:-default}: the single dash substitutes only when the variable is UNSET, so
      # an explicitly empty value stays empty. With a colon an empty override would silently fall back to the
      # URL below and the suite would be proving Alfresco authentication again.
      ALFRESCO_URL: ${ALFRESCO_URL-http://alfresco:8080}
      ALFRESCO_INTERNAL_USERNAME: ${ALFRESCO_ADMIN_USER}
      ALFRESCO_INTERNAL_PASSWORD: ${ALFRESCO_ADMIN_PASSWORD}
      NUXEO_URL: ${NUXEO_URL-http://host.docker.internal:8081/nuxeo}
      NUXEO_USERNAME: ${NUXEO_USERNAME:-Administrator}
      NUXEO_PASSWORD: ${NUXEO_PASSWORD:-Administrator}
      NUXEO_SOURCE_ID: ${NUXEO_SOURCE_ID:-local}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      RAG_PERMISSION_SOURCE_IDS: ${RAG_PERMISSION_SOURCE_IDS:-}
      # What happens when a caller's group membership cannot be read from a source repository.
      # fail-closed (the application default) drops that source from the permission filter; degrade
      # keeps the caller's own name plus GROUP_EVERYONE. Both log at WARN.
      RAG_SECURITY_GROUP_RESOLUTION_FAILURE: ${RAG_SECURITY_GROUP_RESOLUTION_FAILURE:-fail-closed}
      # Whether GROUP_ALFRESCO_ADMINISTRATORS reads an Alfresco source with no sys_racl condition at
      # all. The application default is off, so an administrator is ACL-filtered like anyone else.
      # This stack opts in: it is a demo where admin:admin is the working account, repository-admin
      # discoverability is part of what it shows, and the ACL suite asserts it. A deployment that
      # wants administrators subject to document ACLs sets this to false.
      RAG_SECURITY_ADMIN_BYPASS_ENABLED: ${RAG_SECURITY_ADMIN_BYPASS_ENABLED:-true}
      # Entra ID group membership on the query path, which is what makes a SharePoint document granted to a
      # group retrievable by its members. Off by default, and a deployment with no Graph source should leave
      # it off: a resolver that exists and cannot reach its directory is worse than none, because
      # RAG_SECURITY_GROUP_RESOLUTION_FAILURE then costs a caller the whole source on every query, where no
      # resolver merely leaves group-granted documents invisible.
      #
      # Credentials are configured separately from the connector's on purpose. The connector's Graph client
      # lives inside a shaded plugin jar this service never loads, and its resource-unit meter and
      # tenant-wide throttle pause are built for a crawl; this makes one call per user per cache window. The
      # cost of that choice is two credentials to keep in step.
      RAG_SECURITY_ENTRA_ENABLED: ${RAG_SECURITY_ENTRA_ENABLED:-false}
      RAG_SECURITY_ENTRA_TENANT_ID: ${RAG_SECURITY_ENTRA_TENANT_ID:-}
      RAG_SECURITY_ENTRA_CLIENT_ID: ${RAG_SECURITY_ENTRA_CLIENT_ID:-}
      RAG_SECURITY_ENTRA_CLIENT_SECRET: ${RAG_SECURITY_ENTRA_CLIENT_SECRET:-}
      RAG_SECURITY_ENTRA_CERTIFICATE_PATH: ${RAG_SECURITY_ENTRA_CERTIFICATE_PATH:-}
      RAG_SECURITY_ENTRA_CERTIFICATE_PASSWORD: ${RAG_SECURITY_ENTRA_CERTIFICATE_PASSWORD:-}
      # client-credentials, or static-token for a run against the mock Graph service.
      RAG_SECURITY_ENTRA_AUTH_MODE: ${RAG_SECURITY_ENTRA_AUTH_MODE:-client-credentials}
      RAG_SECURITY_ENTRA_ACCESS_TOKEN: ${RAG_SECURITY_ENTRA_ACCESS_TOKEN:-}
      RAG_SECURITY_ENTRA_GRAPH_BASE_URL: ${RAG_SECURITY_ENTRA_GRAPH_BASE_URL:-}
      # The source type whose group principals this resolves, matching the connector's cin_sourceId prefix.
      RAG_SECURITY_ENTRA_SOURCE_TYPE: ${RAG_SECURITY_ENTRA_SOURCE_TYPE:-sharepoint}
      # A caller authenticates against Alfresco or Nuxeo, so their username is not necessarily their Entra
      # identity. This appends a domain to a bare username, which covers one tenant whose UPNs are
      # <username>@<domain>. Anything more elaborate is an identity-mapping problem this does not solve; an
      # unknown identity is a 404, which costs the caller only this source's group grants.
      RAG_SECURITY_ENTRA_USERNAME_SUFFIX: ${RAG_SECURITY_ENTRA_USERNAME_SUFFIX:-}
      # user (the caller's own groups, needs a user-read permission) or group (asks the indexed groups,
      # needs GroupMember.Read.All only, matches callers signed in with Entra ID).
      RAG_SECURITY_ENTRA_MEMBERSHIP_LOOKUP: ${RAG_SECURITY_ENTRA_MEMBERSHIP_LOOKUP:-user}
      # Caller authentication against a CMIS repository, so a deployment whose only source is the CMIS
      # connector can be queried by its own users rather than by a service account.
      #
      # Unlike every resolver above, this uses the CALLER'S OWN credentials: there is no service account and
      # no secret here, which is the whole reason it needs no registration or credential to be useful.
      #
      # Consulted only after Alfresco and Nuxeo decline, so turning it on cannot change where an existing
      # deployment's passwords are sent first. Enabled with a blank URL fails startup naming the setting,
      # rather than silently refusing every CMIS caller.
      RAG_SECURITY_CMIS_ENABLED: ${RAG_SECURITY_CMIS_ENABLED:-false}
      # The same endpoint the connector takes as CMIS_URL. Resolved inside the stack network.
      RAG_SECURITY_CMIS_URL: ${RAG_SECURITY_CMIS_URL:-}
      # Optional. When set, the service document must name this repository, so a URL pointed at the wrong
      # CMIS server is rejected rather than trusted with a caller's password.
      RAG_SECURITY_CMIS_REPOSITORY_ID: ${RAG_SECURITY_CMIS_REPOSITORY_ID:-}
      # Accounts allowed to read every submitter's feedback (GET /api/rag/feedback?scope=all). Everyone
      # else reads only their own ratings. The application default is empty; this stack names the two
      # repository admin accounts so `cleval feedback import`, which needs the whole corpus, works
      # against it. Clear it for a deployment where no one aggregates feedback.
      RAG_FEEDBACK_OPERATOR_USERS: ${RAG_FEEDBACK_OPERATOR_USERS:-admin,Administrator}
      # Multi-embedding-type retrieval. Empty by default, which leaves the vector leg on the single
      # wildcard call it has always made. List a retired model here during a migration and its
      # embedding type is queried in its own vector space, which is what stops recall dropping for
      # documents not yet moved onto the new model. Comma separated; coexisting types must share
      # vector dimensionality.
      RAG_EMBEDDING_ADDITIONAL_MODELS: ${RAG_EMBEDDING_ADDITIONAL_MODELS:-}
      RAG_EMBEDDING_TYPE_DISCOVERY_ENABLED: ${RAG_EMBEDDING_TYPE_DISCOVERY_ENABLED:-true}
      RAG_EMBEDDING_TYPE_DISCOVERY_TTL_SECONDS: ${RAG_EMBEDDING_TYPE_DISCOVERY_TTL_SECONDS:-300}
      # Re-embeds the corpus into the configured type at a controlled rate while the previous type
      # keeps answering queries. Off by default: it writes to every document and spends the embedding
      # throughput the ingesters need. The endpoints also require an account named below, so enabling
      # the flag alone does not open them.
      RAG_EMBEDDING_BACKFILL_ENABLED: ${RAG_EMBEDDING_BACKFILL_ENABLED:-false}
      RAG_EMBEDDING_BACKFILL_DOCS_PER_MINUTE: ${RAG_EMBEDDING_BACKFILL_DOCS_PER_MINUTE:-60}
      RAG_EMBEDDING_BACKFILL_OPERATOR_USERS: ${RAG_EMBEDDING_BACKFILL_OPERATOR_USERS:-admin,Administrator}
      HXPR_USERNAME: ${HXPR_USERNAME}
      HXPR_PASSWORD: ${HXPR_PASSWORD}
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
      LLM_MODEL: ${LLM_MODEL:-local/olmo3-7b-instruct:Q4_K_M}
      # Pinned to 0 so a generation delta is attributable to a change rather than to sampling
      # noise: at 0.3 the same question yields a different answer per run, and the tier-2 judge
      # metrics (faithfulness, answer_correctness, citation_accuracy) cannot form a stable
      # baseline. Overridable per environment for deployments that want more varied phrasing.
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      # The Spring AI OpenAI client defaults to a 10s total request timeout. Local Docker Model
      # Runner generations routinely take 8-15s, so the default intermittently times out with
      # "Total timeout 10000 ms elapsed" and RAG answers fail non-deterministically. Give
      # generation room (retrieval is unaffected).
      SPRING_HTTP_CLIENT_READ_TIMEOUT: ${SPRING_HTTP_CLIENT_READ_TIMEOUT:-180s}
      SPRING_HTTP_CLIENT_CONNECT_TIMEOUT: ${SPRING_HTTP_CLIENT_CONNECT_TIMEOUT:-10s}
      RAG_DEFAULT_TOP_K: ${RAG_DEFAULT_TOP_K:-15}
      RAG_DEFAULT_MIN_SCORE: ${RAG_DEFAULT_MIN_SCORE:-0.0}
      RAG_MAX_CONTEXT_LENGTH: ${RAG_MAX_CONTEXT_LENGTH:-12000}
      RAG_USE_HYBRID_SEARCH: ${RAG_USE_HYBRID_SEARCH:-true}
      # Persistent conversation summary (long-term memory), surfaced in the chat UI. On by default.
      RAG_CONVERSATION_SUMMARY_ENABLED: ${RAG_CONVERSATION_SUMMARY_ENABLED:-true}
      # Citation faithfulness check: populates `verified` / `unsupportedClaims` on prompt responses.
      # Off by default because it costs an extra generation call per answer.
      RAG_CITATION_VERIFY_ENABLED: ${RAG_CITATION_VERIFY_ENABLED:-false}
      SEMANTIC_SEARCH_MIN_SCORE: ${SEMANTIC_SEARCH_MIN_SCORE:-0.2}
      # Retrieval tunables. `environment` is an explicit mapping, so a variable absent from this
      # block never reaches the container however it is set on the host: the service silently keeps
      # its application.yml default. Every knob `content-lake-eval/config/sweeps/` varies must
      # therefore be listed here, or that sweep point measures the default and reports no change.
      # Fusion: weighted/minmax 50-50, measured as sprint 3 (content-lake-eval runs/sprint-3).
      # It beats the rrf default on every gated metric at once (recall@10 0.8143 -> 0.8286,
      # mrr 0.6760 -> 0.6830, ndcg@10 0.7021 -> 0.7083, hit_rate@10 0.8286 -> 0.8429) and lowers
      # latency (search p95 749 -> 628ms). RRF keeps only rank, so a document the vector leg ranked
      # 26th can enter a ten-slot pool on keyword rank alone; minmax keeps each leg's score margin,
      # so a deep-vector-rank document must be a strong keyword match in absolute terms to displace
      # a better one. Normalisation is what matters here, not the weights: max-50-50 was the worst
      # of the eight points swept and minmax-50-50 the best.
      SEARCH_HYBRID_STRATEGY: ${SEARCH_HYBRID_STRATEGY:-weighted}
      SEARCH_HYBRID_NORMALIZATION: ${SEARCH_HYBRID_NORMALIZATION:-minmax}
      SEARCH_HYBRID_VECTOR_WEIGHT: ${SEARCH_HYBRID_VECTOR_WEIGHT:-0.5}
      SEARCH_HYBRID_TEXT_WEIGHT: ${SEARCH_HYBRID_TEXT_WEIGHT:-0.5}
      # Only read when SEARCH_HYBRID_STRATEGY is rrf. Swept: k20 edges k60 on ranking, k120 is
      # identical to k60, and all three trail weighted/minmax.
      SEARCH_HYBRID_RRF_K: ${SEARCH_HYBRID_RRF_K:-60}
      SEARCH_HYBRID_INITIAL_CANDIDATES: ${SEARCH_HYBRID_INITIAL_CANDIDATES:-75}
      SEARCH_HYBRID_FINAL_RESULTS: ${SEARCH_HYBRID_FINAL_RESULTS:-20}
      # Keep at or near 0 on the hybrid path. Fused scores are on the fusion's own scale, not
      # cosine's: under rrf they span roughly 0.02-0.03, so a cosine-looking 0.1 discards every
      # result (measured: recall@10 0.0000, zero_result_rate 1.0000 at 0.1, 0.2 and 0.4).
      SEARCH_HYBRID_MIN_SCORE: ${SEARCH_HYBRID_MIN_SCORE:-0.01}
      RAG_MMR_ENABLED: ${RAG_MMR_ENABLED:-false}
      RAG_MMR_LAMBDA: ${RAG_MMR_LAMBDA:-0.5}
      RAG_MMR_POOL_SIZE: ${RAG_MMR_POOL_SIZE:-30}
      # Query expansion (sprint 2). Off by default, and the reason is latency, not quality: every
      # technique measured beats the control on all four gated retrieval metrics, but each adds one LLM
      # rewrite call plus an embedding and hxpr round trip per variant, and on a local Docker Model
      # Runner that call dominates. Measured on the eval-005 corpus (78 questions, 41 docs), against
      # off = recall@10 0.8286 / mrr 0.6830 / ndcg@10 0.7083 / hit_rate@10 0.8429, search p50 423ms:
      #
      #   multi-query 2 variants   recall 0.8643  mrr 0.7217  ndcg 0.7477  hit 0.8857  p50 4083ms
      #   multi-query 3 variants   recall 0.8500  mrr 0.7307  ndcg 0.7445  hit 0.8857  p50 4818ms
      #   multi-query 3 + rrf-k 20 recall 0.8500  mrr 0.7479  ndcg 0.7544  hit 0.8857  p50 4806ms
      #   multi-query 5 variants   recall 0.8571  mrr 0.7100  ndcg 0.7360  hit 0.8857  p50 6387ms
      #   HyDE 1000 chars          recall 0.8429  mrr 0.6879  ndcg 0.7184  hit 0.8571  p50 3581ms
      #   HyDE 400 chars           recall 0.8429  mrr 0.6950  ndcg 0.7236  hit 0.8571  p50 3516ms
      #   HyDE + multi-query 3     recall 0.8500  mrr 0.7216  ndcg 0.7382  hit 0.8857  p50 8551ms
      #
      # So multi-query is the technique that earns its place, ~11x search latency is the price, and the
      # exact variant count is within noise on 78 questions. HyDE on top of multi-query costs latency
      # and slightly LOWERS mrr/ndcg versus multi-query alone, so the two do not compose.
      # keyword_leg_hit_rate held at 1.0000 and zero_result_rate at 0.0000 on every point.
      #
      # RAG_QUERY_EXPANSION_MAX_VARIANTS caps the total, counting the original query, however many
      # techniques are on. RAG_QUERY_EXPANSION_RRF_K fuses across variants and is distinct from
      # SEARCH_HYBRID_RRF_K, which fuses the vector and keyword legs of one variant.
      RAG_QUERY_EXPANSION_MAX_VARIANTS: ${RAG_QUERY_EXPANSION_MAX_VARIANTS:-6}
      RAG_QUERY_EXPANSION_RRF_K: ${RAG_QUERY_EXPANSION_RRF_K:-60}
      RAG_MULTI_QUERY_ENABLED: ${RAG_MULTI_QUERY_ENABLED:-false}
      RAG_MULTI_QUERY_VARIANTS: ${RAG_MULTI_QUERY_VARIANTS:-3}
      RAG_HYDE_ENABLED: ${RAG_HYDE_ENABLED:-false}
      RAG_HYDE_MAX_CHARS: ${RAG_HYDE_MAX_CHARS:-1000}
      # Decomposition is the one technique the sweep argues AGAINST at tier 0: recall@10 stays flat at
      # 0.8286 while mrr falls 0.6830 -> 0.6477 and ndcg@10 0.7083 -> 0.6853, at both max-2 and max-4.
      # Sub-questions dilute the ranking without surfacing evidence the original query missed. Its real
      # target is tier-2 completeness (0.5766), which tier 0 cannot see, so this is "unproven", not
      # "useless" -- but it does not go on by default on a ranking regression.
      RAG_QUERY_DECOMPOSITION_ENABLED: ${RAG_QUERY_DECOMPOSITION_ENABLED:-false}
      RAG_QUERY_DECOMPOSITION_MAX_SUB_QUESTIONS: ${RAG_QUERY_DECOMPOSITION_MAX_SUB_QUESTIONS:-4}
      # Verbatim matching for identifier-like queries. An extra pass restricted to chunks holding the
      # identifier literally, added only when the query names one. Distinct from expansion: the problem
      # with a short alphanumeric token is that it is rare, not that the query is ambiguous, which is why
      # rewording it does not help. Off by default until the identifier sweep confirms the gain.
      RAG_VERBATIM_IDENTIFIER_ENABLED: ${RAG_VERBATIM_IDENTIFIER_ENABLED:-false}
      RAG_VERBATIM_IDENTIFIER_MIN_LENGTH: ${RAG_VERBATIM_IDENTIFIER_MIN_LENGTH:-3}
      RAG_VERBATIM_IDENTIFIER_MAX_TERMS: ${RAG_VERBATIM_IDENTIFIER_MAX_TERMS:-2}
      # Per-document cap on a result set. topK is a chunk budget and one document contributes all of its
      # chunks, so a long document can fill it alone and crowd every other document out whatever their
      # own scores are. Over-fetching gives the cap something to promote. Off by default until the
      # document-diversity sweep confirms the gain.
      # On by default (#134), and applied to the search endpoints only: the RAG prompt path opts out
      # per request, because capping the generator's context cost faithfulness and citation accuracy on
      # the golden set while raising document recall for a caller browsing results.
      RAG_DOCUMENT_DIVERSITY_ENABLED: ${RAG_DOCUMENT_DIVERSITY_ENABLED:-true}
      RAG_DOCUMENT_DIVERSITY_MAX_CHUNKS_PER_DOCUMENT: ${RAG_DOCUMENT_DIVERSITY_MAX_CHUNKS_PER_DOCUMENT:-2}
      RAG_DOCUMENT_DIVERSITY_OVER_FETCH_FACTOR: ${RAG_DOCUMENT_DIVERSITY_OVER_FETCH_FACTOR:-3}
      # Self-RAG gate. RAG_RETRIEVAL_GRADING_MIN_SCORE is on the fusion's own scale, not cosine's:
      # under the committed weighted/minmax strategy hit scores span 0-1, but under rrf they span
      # roughly 0.02-0.03, so a threshold carried over from one strategy discards everything under the
      # other. 0.0 leaves the gate inert even when enabled, which is the safe default.
      RAG_RETRIEVAL_GRADING_ENABLED: ${RAG_RETRIEVAL_GRADING_ENABLED:-false}
      RAG_RETRIEVAL_GRADING_MIN_SCORE: ${RAG_RETRIEVAL_GRADING_MIN_SCORE:-0.0}
      RAG_RETRIEVAL_GRADING_MIN_HITS: ${RAG_RETRIEVAL_GRADING_MIN_HITS:-1}
      RAG_RETRIEVAL_GRADING_BROADEN: ${RAG_RETRIEVAL_GRADING_BROADEN:-true}
      # Reranker: disabled by default (local/Docker Model Runner). To enable with compose.ai.yaml,
      # set RAG_RERANKER_URL=http://host.docker.internal:12435 in the environment or .env file.
      RAG_RERANKER_URL: ${RAG_RERANKER_URL:-}
      RAG_RERANKER_ENABLED: ${RAG_RERANKER_ENABLED:-false}
      RAG_RERANKER_TOP_N: ${RAG_RERANKER_TOP_N:-8}
      RAG_SOURCE_LINKS_ALFRESCO_TEMPLATE: "/aca/#/search/(viewer:view/{nodeId})?location=%2Frag"
      RAG_SOURCE_LINKS_NUXEO_TEMPLATE: "/nuxeo/ui/#!/browse{nuxeoPath}"
      # Tracing (#73) and span payloads (#116). A blank endpoint means "create spans, export nothing",
      # which is the application default; with --profile observability, point it at the bundled
      # collector: http://otel-lgtm:4318/v1/traces
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-}
      # The only sampling knob. Listed here because environment is an explicit mapping: without this
      # line the variable never reaches the container, so the knob is configurable in the application
      # and not on the stack.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-0.1}
      # Attaches chunk ids, scores, counts and token usage to the RAG spans. Off by default.
      RAG_OBSERVABILITY_PAYLOADS_ENABLED: ${RAG_OBSERVABILITY_PAYLOADS_ENABLED:-false}
      # ALSO copies the question, the retrieved chunk text, source names and paths, and the answer into
      # the trace backend. That is ACL-protected content leaving the service, and the backend's readers
      # are whoever can reach it rather than the ACL that governed the retrieval. Off by default; read
      # docs/security-model.md before turning it on.
      RAG_OBSERVABILITY_CAPTURE_CONTENT: ${RAG_OBSERVABILITY_CAPTURE_CONTENT:-false}
      RAG_OBSERVABILITY_MAX_CHUNKS_RECORDED: ${RAG_OBSERVABILITY_MAX_CHUNKS_RECORDED:-20}
      RAG_OBSERVABILITY_MAX_CONTENT_CHARS: ${RAG_OBSERVABILITY_MAX_CONTENT_CHARS:-2000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hxpr-app:
        condition: service_healthy
    networks:
      - stack

  # ── Nuxeo ingesters ─────────────────────────────────────────────────────────
  # Requires the Nuxeo server running separately:
  #   docker compose -f ../nuxeo-deployment/compose.yaml up -d

  nuxeo-batch-ingester:
    profiles: [nuxeo, full, demo]
    image: content-lake-app/nuxeo-batch-ingester:local
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
      target: nuxeo-batch-ingester
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/AlfrescoLabs/content-lake-app.git#main}"
      args:
        - CONTENT_LAKE_BUILD_IMAGE
        - CONTENT_LAKE_RUNTIME_IMAGE
    environment:
      NUXEO_URL: http://host.docker.internal:8081/nuxeo
      NUXEO_USERNAME: ${NUXEO_USERNAME:-Administrator}
      NUXEO_PASSWORD: ${NUXEO_PASSWORD:-Administrator}
      NUXEO_SOURCE_ID: ${NUXEO_SOURCE_ID:-local}
      NUXEO_INCLUDED_ROOT_1: ${NUXEO_INCLUDED_ROOT_1:-/default-domain/workspaces}
      NUXEO_DISCOVERY_MODE: ${NUXEO_DISCOVERY_MODE:-CHILDREN}
      # No repository transform service backs this source, so extraction is in-process Tika
      # unless an engine is configured. Empty = unchanged behaviour. Point it at the
      # transform-extras profile for markdown extraction, e.g.
      #   transform:http://transform-convert2md:8090,transform:http://transform-liteparse:8090
      # which gives PDF tables from convert2md and spreadsheet tables from liteparse.
      EXTRACTION_ENGINE_URLS: ${EXTRACTION_ENGINE_URLS:-}
      EXTRACTION_ENGINE_TIMEOUT_MS: ${EXTRACTION_ENGINE_TIMEOUT_MS:-300000}
      EXTRACTION_FORMAT: ${EXTRACTION_FORMAT:-plaintext}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      HXPR_TARGET_PATH: ${HXPR_NUXEO_TARGET_PATH:-/nuxeo-sync}
      HXPR_USERNAME: ${HXPR_USERNAME}
      HXPR_PASSWORD: ${HXPR_PASSWORD}
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
      LLM_MODEL: ${LLM_MODEL:-ai/gpt-oss}
      SPRING_HTTP_CLIENT_READ_TIMEOUT: ${SPRING_HTTP_CLIENT_READ_TIMEOUT:-180s}
      SPRING_HTTP_CLIENT_CONNECT_TIMEOUT: ${SPRING_HTTP_CLIENT_CONNECT_TIMEOUT:-10s}
      # Post-discovery reconciliation sweep. Application default is false; this stack opts in for the
      # end-to-end delete-while-live-ingester-down case, with the ratio raised for a small corpus.
      NUXEO_BATCH_RECONCILE_ENABLED: ${NUXEO_BATCH_RECONCILE_ENABLED:-true}
      NUXEO_BATCH_RECONCILE_MAX_DELETE_RATIO: ${NUXEO_BATCH_RECONCILE_MAX_DELETE_RATIO:-0.5}
      NUXEO_BATCH_RECONCILE_MAX_DELETES: ${NUXEO_BATCH_RECONCILE_MAX_DELETES:-1000}
      NUXEO_BATCH_RECONCILE_MAX_SEEN_IDS: ${NUXEO_BATCH_RECONCILE_MAX_SEEN_IDS:-200000}
      NUXEO_BATCH_RECONCILE_PAGE_SIZE: ${NUXEO_BATCH_RECONCILE_PAGE_SIZE:-200}
      # This service ingests through the client it was compiled against, never from a mounted jar,
      # so a connector whose settings are supplied to plugin-batch-ingester alone is listed with
      # its problem on GET /api/connectors rather than being fatal here. Set fail to refuse to start.
      CONNECTOR_VALIDATION: ${CONNECTOR_VALIDATION_INGESTERS:-warn}
    volumes:
      # Connector plugins (#124): any jar dropped in here is discovered at startup. Empty by default, so
      # this changes nothing until a connector is placed in it. Read-only: an ingester has no business
      # writing to its own plugin directory.
      - "${CONNECTOR_PLUGIN_PATH:-./connectors}:/opt/content-lake/connectors:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hxpr-app:
        condition: service_healthy
    networks:
      - stack

  plugin-batch-ingester:
    # Opt-in profile only: combine with a base stack that provides hxpr, e.g.
    #   docker compose --profile alfresco --profile connector up -d
    #
    # The ingester whose source is a plugin connector (#132). Unlike every other ingester it builds no
    # source adapter: the client comes from a jar in ./connectors at startup. With that directory empty
    # this service fails to start, deliberately, because it has nothing it could ingest from.
    #
    # A connector's own settings are passed here like any other environment variable, using the names its
    # schema declares. Hyphens become underscores, so `sample-directory.root-path` is
    # SAMPLE_DIRECTORY_ROOT_PATH. GET /api/connectors/schema lists what the mounted connector wants.
    profiles: [connector]
    image: content-lake-app/plugin-batch-ingester:local
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
      target: plugin-batch-ingester
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/AlfrescoLabs/content-lake-app.git#main}"
      args:
        - CONTENT_LAKE_BUILD_IMAGE
        - CONTENT_LAKE_RUNTIME_IMAGE
    ports:
      # Published rather than reached through the proxy's `?sourceType=` map, which cannot serve this
      # service: the key would have to be the source type the mounted jar declares, and that is unknown
      # when the nginx config is rendered. A published port also keeps /api/connectors reachable while
      # diagnosing a jar that did not load.
      - "${CONNECTOR_PORT:-9096}:9096"
    environment:
      # Which loaded connector to ingest with. Only needed when several jars are mounted.
      CONNECTOR_SOURCE_TYPE: ${CONNECTOR_SOURCE_TYPE:-}
      # Containers to walk, comma separated. Empty asks the connector where to start, which is what a
      # connector implementing ContentSourceClient.getRootNodeId() answers.
      CONNECTOR_ROOTS: ${CONNECTOR_ROOTS:-}
      CONNECTOR_PAGE_SIZE: ${CONNECTOR_PAGE_SIZE:-100}
      CONNECTOR_MAX_DEPTH: ${CONNECTOR_MAX_DEPTH:-50}
      # warn starts even when a connector's configuration does not satisfy its schema, reporting it on
      # GET /api/connectors instead. fail (the default) refuses to start.
      CONNECTOR_VALIDATION: ${CONNECTOR_VALIDATION:-fail}
      # Settings for the example connector in ../content-lake-app/plugins/examples. Harmless
      # when a different connector is mounted: an unrecognised variable is simply never read.
      SAMPLE_DIRECTORY_ROOT_PATH: ${SAMPLE_DIRECTORY_ROOT_PATH:-/data/connector}
      SAMPLE_DIRECTORY_SOURCE_ID: ${SAMPLE_DIRECTORY_SOURCE_ID:-sample-directory}
      # Settings for the CMIS connector in ../content-lake-app/plugins/cmis-connector (#125), which
      # ingests any CMIS 1.1 repository. Empty unless a deployment sets them, and the schema is what
      # refuses startup when a required one is missing, naming the setting rather than failing later.
      # Batch only: CMIS has no change feed, so there is no live counterpart to this service.
      CMIS_URL: ${CMIS_URL:-}
      CMIS_BINDING: ${CMIS_BINDING:-browser}
      CMIS_REPOSITORY_ID: ${CMIS_REPOSITORY_ID:-}
      CMIS_USERNAME: ${CMIS_USERNAME:-}
      CMIS_PASSWORD: ${CMIS_PASSWORD:-}
      CMIS_ROOT_PATH: ${CMIS_ROOT_PATH:-}
      CMIS_SOURCE_ID: ${CMIS_SOURCE_ID:-}
      CMIS_INCLUDE_PATHS: ${CMIS_INCLUDE_PATHS:-}
      CMIS_EXCLUDE_PATHS: ${CMIS_EXCLUDE_PATHS:-}
      CMIS_INCLUDE_MIME_TYPES: ${CMIS_INCLUDE_MIME_TYPES:-}
      CMIS_EXCLUDE_MIME_TYPES: ${CMIS_EXCLUDE_MIME_TYPES:-}
      CMIS_PAGE_SIZE: ${CMIS_PAGE_SIZE:-100}
      # What to do when the repository cannot report ACLs: fail-closed (the default, ingest nothing),
      # sync-account (readable by CMIS_USERNAME only) or public (readable by everyone). A repository
      # whose permissions cannot be read must not silently produce world-readable documents.
      CMIS_ACL_FALLBACK: ${CMIS_ACL_FALLBACK:-fail-closed}
      # Settings for the SharePoint Online connector in
      # ../content-lake-app/plugins/sharepoint-connector, which ingests SharePoint through Microsoft
      # Graph. Empty unless a deployment sets them, and the schema is what refuses to load the jar when a
      # required one is missing, naming the setting. That refusal is by design: with every connector jar
      # mounted, an unconfigured one declines to load instead of becoming a second candidate.
      #
      # Node ids are '<driveId>:<itemId>', so CONNECTOR_ROOTS takes composite values. Leave it empty for a
      # single drive, which the connector can answer for itself.
      #
      # Three ways to say what to ingest, and the connector requires exactly one of the first two. Name the
      # drives outright, or name the site and let the connector resolve its document libraries. The schema
      # cannot express "exactly one of these", so the check lives in the plugin and a run with neither fails at
      # startup naming the settings.
      SHAREPOINT_DRIVE_IDS: ${SHAREPOINT_DRIVE_IDS:-}
      SHAREPOINT_SITE_URL: ${SHAREPOINT_SITE_URL:-}
      SHAREPOINT_SITE_ID: ${SHAREPOINT_SITE_ID:-}
      # Narrows a resolved site to named libraries, for a site with more than one. Empty takes them all.
      SHAREPOINT_DRIVE_NAMES: ${SHAREPOINT_DRIVE_NAMES:-}
      # Scopes a pass to folders, which is not the same thing as filtering one: folder-paths resolves to item
      # ids that become the walk's roots, so a child outside them is never enumerated and never paid for.
      # include-paths below filters after the walk has already listed every child.
      #
      # It cannot be enforced on a change-feed pass, because a Graph delta response carries no
      # parentReference.path. A deployment that needs path scope honoured on every pass has to leave the feed
      # off.
      SHAREPOINT_FOLDER_PATHS: ${SHAREPOINT_FOLDER_PATHS:-}
      SHAREPOINT_CLIENT_ID: ${SHAREPOINT_CLIENT_ID:-}
      SHAREPOINT_TENANT_ID: ${SHAREPOINT_TENANT_ID:-}
      SHAREPOINT_AUTHORITY: ${SHAREPOINT_AUTHORITY:-}
      # Three modes.
      #
      # client-credentials is app-only, and is the right answer for an unattended crawl across a tenant. It
      # needs an app registration carrying application permissions.
      #
      # device-code authenticates as a named person: a human signs in once on the host with
      # scripts/sharepoint-device-login.sh, and the container refreshes silently from the token cache that
      # produced. Use it where the tenant will not issue application permissions. Two consequences worth
      # knowing before choosing it. It indexes that one identity's view, so content the signed-in user
      # cannot read is absent from the index rather than present and unretrievable. And recovery from a
      # revoked or finally-expired refresh token needs a human, which is why the connector reports this as
      # not a supported production mode at startup.
      #
      # static-token exists for a run against the mock Graph service, and for validating ACL mapping against
      # a developer's own OneDrive; the token it takes cannot be refreshed, so a restarted container cannot
      # authenticate.
      SHAREPOINT_AUTH_MODE: ${SHAREPOINT_AUTH_MODE:-client-credentials}
      # Supply a secret or a certificate, never both. A certificate is preferred in a deployment because a
      # secret expires on a date nobody diarises and takes the crawl down when it does. Neither applies to
      # device-code, which is a public client and holds no credential of its own.
      SHAREPOINT_CLIENT_SECRET: ${SHAREPOINT_CLIENT_SECRET:-}
      SHAREPOINT_CERTIFICATE_PATH: ${SHAREPOINT_CERTIFICATE_PATH:-}
      SHAREPOINT_CERTIFICATE_PASSWORD: ${SHAREPOINT_CERTIFICATE_PASSWORD:-}
      SHAREPOINT_ACCESS_TOKEN: ${SHAREPOINT_ACCESS_TOKEN:-}
      # Where device-code reads its refresh token. The container path of the read-only mount below.
      SHAREPOINT_TOKEN_CACHE_PATH: ${SHAREPOINT_TOKEN_CACHE_PATH:-/var/lib/content-lake/sharepoint-auth/msal-cache.json}
      # Delegated scopes for device-code, comma separated. Empty asks for Sites.Read.All plus offline_access,
      # which is the least-privileged pair measured to serve enumeration, per-item permission reads and
      # content download. Ignored by the other two modes: an app-only token is scoped by the permissions
      # granted to the registration, and Entra rejects resource scopes in a client-credentials request.
      SHAREPOINT_SCOPES: ${SHAREPOINT_SCOPES:-}
      # Point this at the mock Graph service to run without a tenant:
      #   SHAREPOINT_GRAPH_BASE_URL=http://mock-graph:8099/v1.0
      SHAREPOINT_GRAPH_BASE_URL: ${SHAREPOINT_GRAPH_BASE_URL:-}
      SHAREPOINT_SOURCE_ID: ${SHAREPOINT_SOURCE_ID:-}
      SHAREPOINT_INCLUDE_PATHS: ${SHAREPOINT_INCLUDE_PATHS:-}
      SHAREPOINT_EXCLUDE_PATHS: ${SHAREPOINT_EXCLUDE_PATHS:-}
      SHAREPOINT_INCLUDE_MIME_TYPES: ${SHAREPOINT_INCLUDE_MIME_TYPES:-}
      SHAREPOINT_EXCLUDE_MIME_TYPES: ${SHAREPOINT_EXCLUDE_MIME_TYPES:-}
      # fail-closed (the default, do not ingest an item whose permissions cannot be read) or public
      # (readable by everyone). There is no sync-account option as there is for CMIS: app-only auth has no
      # user account whose access could stand in for a document's.
      SHAREPOINT_ACL_FALLBACK: ${SHAREPOINT_ACL_FALLBACK:-fail-closed}
      # map (emit GROUP_<objectId> faithfully) or skip (omit group principals, so a group-only item is
      # readable by nobody). Deliberately no option that widens a group grant to the whole tenant.
      #
      # Either way, a document granted only to an Entra ID group is retrievable by nobody unless
      # RAG_SECURITY_ENTRA_ENABLED is set on rag-service, which is what expands a caller's group membership
      # at query time. Each run logs how many documents that affects.
      SHAREPOINT_GROUP_GRANTS: ${SHAREPOINT_GROUP_GRANTS:-map}
      # per-item (the default) reads one 5-unit permissions collection per item, so a crawl costs about 6
      # resource units per document and the daily cap binds near 200,000 documents. hierarchical reads them
      # only where the sharing hierarchy says they are set, at roughly 1 unit per document.
      #
      # hierarchical needs the Sites.FullControl.All application permission, because that is what
      # Prefer: hierarchicalsharing needs. The connector refuses to run rather than silently falling back if
      # the tenant does not echo the preference: a fallback would quintuple the spend without saying so.
      SHAREPOINT_PERMISSIONS_MODE: ${SHAREPOINT_PERMISSIONS_MODE:-per-item}
      # Display names meaning every user in the tenant, for a tenant that words "Everyone except external
      # users" differently. Empty uses the documented English names plus the spo-grid-all-users claim.
      SHAREPOINT_EVERYONE_CLAIMS: ${SHAREPOINT_EVERYONE_CLAIMS:-}
      # Below Graph's documented per-application per-tenant cap of 1250 units a minute, because that cap
      # is shared by everything using the same app registration. Permissions cost 5 units per item, so a
      # per-item crawl is about 6 units per document and a hierarchical one about 1. Zero disables metering,
      # which is only right against the mock.
      SHAREPOINT_RESOURCE_UNITS_PER_MINUTE: ${SHAREPOINT_RESOURCE_UNITS_PER_MINUTE:-1000}
      SHAREPOINT_RESOURCE_UNIT_BURST: ${SHAREPOINT_RESOURCE_UNIT_BURST:-200}
      # Settings for the filesystem connector in ../content-lake-app/plugins/filesystem-connector, which
      # ingests a mounted directory. It was an in-tree service with a profile of its own until
      # content-lake-app#148; the setting names are unchanged, so an existing FILESYSTEM_* configuration
      # keeps working and only the service running it differs. Mount the content at CONNECTOR_HOST_PATH,
      # which lands on /data/connector below.
      #
      # A filesystem has no permissions to map, so read-principals is the only thing deciding who can
      # retrieve the content, and it defaults to everyone.
      FILESYSTEM_ROOT_PATH: ${FILESYSTEM_ROOT_PATH:-/data/connector}
      FILESYSTEM_SOURCE_ID: ${FILESYSTEM_SOURCE_ID:-filesystem}
      FILESYSTEM_READ_PRINCIPALS: ${FILESYSTEM_READ_PRINCIPALS:-}
      FILESYSTEM_INCLUDE_EXTENSIONS: ${FILESYSTEM_INCLUDE_EXTENSIONS:-}
      FILESYSTEM_EXCLUDE_PATTERNS: ${FILESYSTEM_EXCLUDE_PATTERNS:-}
      FILESYSTEM_PAGE_SIZE: ${FILESYSTEM_PAGE_SIZE:-100}
      # No repository transform service backs a plugin connector, so extraction is in-process Tika
      # unless an engine is configured. A connector that converts its own content bypasses this.
      EXTRACTION_ENGINE_URLS: ${EXTRACTION_ENGINE_URLS:-}
      EXTRACTION_ENGINE_TIMEOUT_MS: ${EXTRACTION_ENGINE_TIMEOUT_MS:-300000}
      EXTRACTION_FORMAT: ${EXTRACTION_FORMAT:-plaintext}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      HXPR_TARGET_PATH: ${HXPR_CONNECTOR_TARGET_PATH:-/connector-sync}
      HXPR_USERNAME: ${HXPR_USERNAME}
      HXPR_PASSWORD: ${HXPR_PASSWORD}
      # Guards this ingester's own sync API. A plugin connector's credentials authenticate it to its
      # source and say nothing about who may trigger a re-ingest, so one configured account guards the
      # API. No compose default: the container refuses to start without both.
      CONNECTOR_SYNC_USERNAME: ${CONNECTOR_SYNC_USERNAME}
      CONNECTOR_SYNC_PASSWORD: ${CONNECTOR_SYNC_PASSWORD}
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
      SPRING_HTTP_CLIENT_READ_TIMEOUT: ${SPRING_HTTP_CLIENT_READ_TIMEOUT:-180s}
      SPRING_HTTP_CLIENT_CONNECT_TIMEOUT: ${SPRING_HTTP_CLIENT_CONNECT_TIMEOUT:-10s}
      # Off by default, and more cautiously than for the filesystem source: the sweep's scope comes from
      # the source paths discovery resolved, and a connector whose nodes report `/` as their path would
      # hand it everything under this source's target path. Check what a run reports as
      # resolvedRootPaths before turning this on.
      CONNECTOR_BATCH_RECONCILE_ENABLED: ${CONNECTOR_BATCH_RECONCILE_ENABLED:-false}
      CONNECTOR_BATCH_RECONCILE_MAX_DELETE_RATIO: ${CONNECTOR_BATCH_RECONCILE_MAX_DELETE_RATIO:-0.5}
      CONNECTOR_BATCH_RECONCILE_MAX_DELETES: ${CONNECTOR_BATCH_RECONCILE_MAX_DELETES:-1000}
      CONNECTOR_BATCH_RECONCILE_MAX_SEEN_IDS: ${CONNECTOR_BATCH_RECONCILE_MAX_SEEN_IDS:-200000}
      CONNECTOR_BATCH_RECONCILE_PAGE_SIZE: ${CONNECTOR_BATCH_RECONCILE_PAGE_SIZE:-200}
      # Read the connector's change feed instead of walking it, when the connector has one. Off by
      # default, and every condition fails towards walking, which is the authoritative mechanism: the
      # feature has to be on, the connector has to claim a feed, and a cursor has to already be stored.
      # The first pass therefore always walks and seeds a cursor; only later passes read the feed.
      CONNECTOR_CHANGE_FEED_ENABLED: ${CONNECTOR_CHANGE_FEED_ENABLED:-false}
      CONNECTOR_CHANGE_FEED_PAGE_SIZE: ${CONNECTOR_CHANGE_FEED_PAGE_SIZE:-200}
      CONNECTOR_CHANGE_FEED_MAX_PAGES: ${CONNECTOR_CHANGE_FEED_MAX_PAGES:-100}
      # Force a full walk, with the reconciliation sweep as configured, every N incremental passes. Zero
      # never forces one, which is right for a feed that reports deletions first-hand.
      CONNECTOR_CHANGE_FEED_FULL_WALK_EVERY: ${CONNECTOR_CHANGE_FEED_FULL_WALK_EVERY:-0}
      # Where the cursor lives. hxpr (the default) keeps one state document per source in the index and so
      # needs nothing the deployment does not already have; file uses the writable mount below; memory
      # forgets it on restart, which means every pass walks.
      CONNECTOR_CURSOR_STORE: ${CONNECTOR_CURSOR_STORE:-hxpr}
      CONNECTOR_CURSOR_HXPR_PATH: ${CONNECTOR_CURSOR_HXPR_PATH:-/content-lake/_state/cursors}
      CONNECTOR_CURSOR_FILE: ${CONNECTOR_CURSOR_FILE:-/var/lib/content-lake/connector/cursor.json}
      # Where the roots an operator chose are kept, so changing a scope needs no restart. The application's
      # own default is `none`, which makes the feature additive but also inert: with no store /api/selection
      # answers 501 and /api/browse/roots can never resolve from a selection, so the folder picker has nothing
      # to write to. This deployment opts in.
      #
      # hxpr for the same reason the cursor uses it: one state document per source, needing nothing the
      # deployment does not already have. A separate hxpr folder from the cursors is deliberate, since both
      # are keyed by the qualified source id and one folder would collide them.
      #
      # Note what that means for lifetime. A selection lives in the index, so `make clean` wipes it along with
      # everything else; a container restart does not. "Survives a restart" and "survives make clean" are
      # different claims and only the first is true. That is the opposite of the token cache below, which is a
      # credential a human minted interactively and therefore gets a host bind mount instead.
      CONNECTOR_SELECTION_STORE: ${CONNECTOR_SELECTION_STORE:-hxpr}
      CONNECTOR_SELECTION_HXPR_PATH: ${CONNECTOR_SELECTION_HXPR_PATH:-/content-lake/_state/roots}
      CONNECTOR_SELECTION_FILE: ${CONNECTOR_SELECTION_FILE:-/var/lib/content-lake/connector/roots.json}
      # Where a connector may persist state between runs, such as a change cursor or a delta token. The
      # host only provides somewhere writable and names it; a connector that needs state declares its own
      # setting in its ConnectorSchema and the operator points that setting at this path. Nothing reads
      # this variable by itself.
      #
      # Only this service gets it. A mounted jar is loaded by all six ingesters, but this is the only one
      # that ingests from the registry, so it is the only one with state to keep.
      CONNECTOR_STATE_DIRECTORY: /var/lib/content-lake/connector
    volumes:
      # Content for a connector that reads a mounted path, such as the sample directory connector.
      # Override with CONNECTOR_HOST_PATH. A connector that talks to a remote repository ignores it.
      - "${CONNECTOR_HOST_PATH:-./filesystem-data}:/data/connector:ro"
      # Connector plugins (#124): any jar dropped in here is discovered at startup. For this service the
      # directory is not optional, since the jar it finds here is its only source.
      - "${CONNECTOR_PLUGIN_PATH:-./connectors}:/opt/content-lake/connectors:ro"
      # The only writable mount on this service. A named volume rather than a bind mount on purpose: it
      # is wiped by `make clean` along with the index, which is what the standing "start every run from
      # an empty index" rule wants. A bind mount would survive `make clean` and reintroduce exactly the
      # stale-state problem that rule exists to prevent.
      - connector-state-data:/var/lib/content-lake/connector
      # The delegated token cache for SHAREPOINT_AUTH_MODE=device-code, populated on the host by
      # scripts/sharepoint-device-login.sh. Ignored by every other auth mode and by every other connector.
      #
      # A host bind mount rather than a named volume, which is the opposite of the choice made just above,
      # and deliberately so. `make clean` removes every named volume, and the two costs are not comparable:
      # wiping a change cursor costs a re-walk, where wiping a refresh token costs a human sitting at a
      # browser before every end-to-end run. This is a credential a person minted, not state of the index
      # being wiped alongside it.
      #
      # Read-only, so a compromised container can neither corrupt the file nor exfiltrate a rotated
      # credential, and so no host-side ownership change is needed for the unprivileged user the image runs
      # as. Entra issues a new refresh token on each redemption but keeps the previous one valid for its own
      # lifetime, so the connector holds rotations in memory and says so once. When the original finally
      # expires, sign in again.
      - "${SHAREPOINT_TOKEN_CACHE_HOST_PATH:-./sharepoint-auth}:/var/lib/content-lake/sharepoint-auth:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hxpr-app:
        condition: service_healthy
    networks:
      - stack

  mock-graph:
    # Opt-in profile only, and test tooling rather than a product service. Combine with a base stack and
    # the connector profile:
    #   docker compose --profile alfresco --profile connector --profile sharepoint-mock up -d
    #
    # A stand-in for Microsoft Graph, so the SharePoint connector can be run without a Microsoft 365
    # tenant. It exists because a tenant is not merely inconvenient to get: registering an application is
    # disabled in this tenant, and a SharePoint site a developer is only a member of returns a truncated
    # ACL, so it cannot validate permission mapping at all.
    #
    # It is deliberately unhelpful in the same places Graph is. It ignores $skip on children collections,
    # answers /content with a 302 to a URL that rejects an Authorization header, answers 410 for a delta
    # token it does not recognise, and reports Preference-Applied only for the preferences it was told to
    # honour. A mock that were easier to talk to than the real service would let the connector encode the
    # mock's shape and fail against the cloud.
    #
    # What it is not is an authentication server: msal4j rejects an authority that is not https, so a run
    # against this uses SHAREPOINT_AUTH_MODE=static-token. It does check that a bearer token is present.
    profiles: [sharepoint-mock]
    image: content-lake-app/mock-graph:local
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
      target: mock-graph
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/AlfrescoLabs/content-lake-app.git#main}"
      args:
        - MOCK_GRAPH_IMAGE
    ports:
      # Published so the fixtures can be inspected with curl while diagnosing a run.
      - "${MOCK_GRAPH_PORT:-8099}:8099"
    environment:
      MOCK_GRAPH_PORT: 8099
      MOCK_GRAPH_FIXTURES: /fixtures
      MOCK_GRAPH_PAGE_SIZE: ${MOCK_GRAPH_PAGE_SIZE:-200}
      # Empty stands for a tenant that honours no Prefer header, which is the deployment that cannot get
      # Sites.FullControl.All. That is the difference between about one resource unit per document and six,
      # so both answers have to be reachable from configuration.
      MOCK_GRAPH_HONOURED_PREFERENCES: ${MOCK_GRAPH_HONOURED_PREFERENCES:-hierarchicalsharing,deltashowremovedasdeleted}
      # Refuse every Nth request with 429 and a Retry-After, to exercise the connector's pause-and-resume.
      # Zero never throttles.
      MOCK_GRAPH_THROTTLE_EVERY: ${MOCK_GRAPH_THROTTLE_EVERY:-0}
      MOCK_GRAPH_RETRY_AFTER_SECONDS: ${MOCK_GRAPH_RETRY_AFTER_SECONDS:-1}
    networks:
      - stack

  nuxeo-live-ingester:
    profiles: [nuxeo, full, demo]
    image: content-lake-app/nuxeo-live-ingester:local
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
      target: nuxeo-live-ingester
      additional_contexts:
        code: "${CONTENT_LAKE_GIT_CONTEXT:-https://github.com/AlfrescoLabs/content-lake-app.git#main}"
      args:
        - CONTENT_LAKE_BUILD_IMAGE
        - CONTENT_LAKE_RUNTIME_IMAGE
    environment:
      NUXEO_URL: http://host.docker.internal:8081/nuxeo
      NUXEO_USERNAME: ${NUXEO_USERNAME:-Administrator}
      NUXEO_PASSWORD: ${NUXEO_PASSWORD:-Administrator}
      NUXEO_SOURCE_ID: ${NUXEO_SOURCE_ID:-local}
      NUXEO_LIVE_AUDIT_ENABLED: ${NUXEO_LIVE_AUDIT_ENABLED:-true}
      # Empty: one cursor file per source, /data/audit-cursor-<NUXEO_SOURCE_ID>.json, so two Nuxeo live
      # ingesters on one volume never overwrite each other. The single /data/audit-cursor.json of an older
      # deployment is read once on upgrade.
      NUXEO_LIVE_AUDIT_CURSOR_FILE: ${NUXEO_LIVE_AUDIT_CURSOR_FILE:-}
      NUXEO_INCLUDED_ROOT_1: ${NUXEO_INCLUDED_ROOT_1:-/default-domain/workspaces}
      # No repository transform service backs this source, so extraction is in-process Tika
      # unless an engine is configured. Empty = unchanged behaviour. Point it at the
      # transform-extras profile for markdown extraction, e.g.
      #   transform:http://transform-convert2md:8090,transform:http://transform-liteparse:8090
      # which gives PDF tables from convert2md and spreadsheet tables from liteparse.
      EXTRACTION_ENGINE_URLS: ${EXTRACTION_ENGINE_URLS:-}
      EXTRACTION_ENGINE_TIMEOUT_MS: ${EXTRACTION_ENGINE_TIMEOUT_MS:-300000}
      EXTRACTION_FORMAT: ${EXTRACTION_FORMAT:-plaintext}
      HXPR_URL: http://hxpr-app:8080
      HXPR_REPOSITORY_ID: ${HXPR_REPOSITORY_ID}
      HXPR_TARGET_PATH: ${HXPR_NUXEO_TARGET_PATH:-/nuxeo-sync}
      HXPR_USERNAME: ${HXPR_USERNAME}
      HXPR_PASSWORD: ${HXPR_PASSWORD}
      MODEL_RUNNER_URL: ${MODEL_RUNNER_URL:-http://host.docker.internal:12434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ai/mxbai-embed-large}
      LLM_MODEL: ${LLM_MODEL:-ai/gpt-oss}
      SPRING_HTTP_CLIENT_READ_TIMEOUT: ${SPRING_HTTP_CLIENT_READ_TIMEOUT:-180s}
      SPRING_HTTP_CLIENT_CONNECT_TIMEOUT: ${SPRING_HTTP_CLIENT_CONNECT_TIMEOUT:-10s}
      # This service ingests through the client it was compiled against, never from a mounted jar,
      # so a connector whose settings are supplied to plugin-batch-ingester alone is listed with
      # its problem on GET /api/connectors rather than being fatal here. Set fail to refuse to start.
      CONNECTOR_VALIDATION: ${CONNECTOR_VALIDATION_INGESTERS:-warn}
    volumes:
      - nuxeo-live-audit-data:/data
      # Connector plugins (#124): any jar dropped in here is discovered at startup. Empty by default, so
      # this changes nothing until a connector is placed in it. Read-only: an ingester has no business
      # writing to its own plugin directory.
      - "${CONNECTOR_PLUGIN_PATH:-./connectors}:/opt/content-lake/connectors:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hxpr-app:
        condition: service_healthy
    networks:
      - stack

  # ── Transform engines (opt-in) ──────────────────────────────────────────────
  #
  # Structure-aware text extraction. The official transform-core-aio produces text/plain only, so a
  # table arrives as an undelimited run of text and is chunked as prose; liteparse produces
  # text/markdown for PDF and Office formats, which keeps headings and table rows intact so chunking
  # can segment on them and mark a table chunk as such.
  #
  # Strictly opt-in, on its own profile, and asserted so by `make verify-profiles`: every base profile
  # behaves identically without it. Turn it on with, for example:
  #
  #   EXTRACTION_FORMAT=auto docker compose --profile alfresco --profile transform-extras up -d
  #
  # Content Lake talks the alfresco-transform-core /transform protocol to it directly rather than
  # through a repository, so the same engine serves the Alfresco, Nuxeo and filesystem connectors.
  # For Alfresco set TRANSFORM_URL; for Nuxeo and filesystem set EXTRACTION_ENGINE_URL. Either way
  # EXTRACTION_FORMAT must be auto or markdown, or the engine is still asked for text/plain.
  transform-liteparse:
    profiles: [transform-extras]
    # Pinned rather than :latest so a run is reproducible. liteparse is ~370 MB and needs about 1 GB
    # of heap for the LibreOffice conversions behind the Office formats; it needs no GPU, so it does
    # not interact with the AI inference stack on port 12434.
    #
    # 1.1.0 or newer is required for spreadsheets: earlier images reached a sheet through a page
    # render and silently dropped any column past the page width, and produced no markdown tables.
    image: angelborroy/alf-tengine-liteparse:${TRANSFORM_EXTRAS_TAG:-1.1.0}
    restart: unless-stopped
    environment:
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80
        -Dlogging.level.org.alfresco.transform=ERROR
      # Deliberately absent: TEST_ENDPOINT_ENABLED. The browser form at / (which POSTs to /test) is
      # disabled by default in alfresco-transform-core 5.4.1 and must stay disabled outside local
      # development, because it accepts and transforms arbitrary uploads with no authentication.
    # No `ports:` mapping. The engine is reachable only inside the stack network, matching
    # transform-core-aio, which also publishes nothing. Never expose 8090 to the host.
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      # Generous start_period: the first call after a container start pays one-off initialisation, and
      # a cold start read as a hang leads to the engine being blamed for a timeout it did not cause.
      retries: 10
      start_period: 60s
    networks:
      - stack

  # Docling-based PDF to Markdown. Unlike liteparse this recovers real markdown tables, which is what
  # ChunkType.TABLE detection needs; measured on a 2-page fixture, its markdown separator-row count
  # matched the source table count exactly, with every column and value preserved.
  #
  # The cost is latency, and it is large: ~20.5s per 2-page PDF warm, against ~0.3-0.65s for liteparse,
  # roughly 65x. Memory is not the differentiator (~310 MB in use, less than liteparse). So this is the
  # engine to point at a table-heavy corpus where the ingest time is acceptable, not a general default.
  #
  # PDF only -- it advertises no DOCX, XLSX or PPTX transform. Route Office formats to liteparse.
  #
  #   EXTRACTION_FORMAT=auto TRANSFORM_URL=http://transform-convert2md:8090 \
  #     docker compose --profile alfresco --profile transform-extras up -d
  transform-convert2md:
    profiles: [transform-extras]
    # A real released tag exists for this engine, so there is no reason to track :latest.
    image: angelborroy/alf-tengine-convert2md:${TRANSFORM_CONVERT2MD_TAG:-1.1.0}
    restart: unless-stopped
    environment:
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80
        -Dlogging.level.org.alfresco.transform=ERROR
      # TEST_ENDPOINT_ENABLED deliberately absent, as for liteparse.
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      # Docling loads a layout model, so first readiness is slow. Give it room: a cold start read as a
      # hang gets the engine blamed for a timeout it did not cause.
      retries: 20
      start_period: 120s
    networks:
      - stack
